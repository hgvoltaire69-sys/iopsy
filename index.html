<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐱 Mei Mei's Study Café · Lessons 3–5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --bg:#fef6ec;--card:#fffaf2;--tx:#3d2e1e;--mu:#9a836a;
  --ac:#e8914f;--acs:#fde8d4;--ok:#5da66e;--oks:#dff0e3;
  --no:#d4574a;--nos:#fce0dc;--bd:#ecdcc8;
  --paw:#f5c584;--fur:#d4a05a;--nose:#e8914f;
  --cat-bg:linear-gradient(135deg,#fef6ec 0%,#fde8d4 50%,#fef6ec 100%);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1710;--card:#2a2118;--tx:#f0e4d6;--mu:#b09a82;
  --ac:#f0a060;--acs:#3d2c1a;--ok:#7cc996;--oks:#1e3028;
  --no:#e88a7e;--nos:#3d2220;--bd:#3d3228;
  --paw:#b08040;--fur:#c09050;--nose:#e89060;
  --cat-bg:linear-gradient(135deg,#1e1710 0%,#2a2118 50%,#1e1710 100%);
}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--cat-bg);color:var(--tx);
  font:17px/1.6 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  min-height:100dvh;overflow-x:hidden;
}

/* floating paw prints background */
body::before{
  content:'🐾';position:fixed;top:-30px;left:10%;font-size:80px;opacity:.06;
  animation:floatPaw 18s ease-in-out infinite;pointer-events:none;z-index:0;
}
body::after{
  content:'🐾';position:fixed;bottom:-30px;right:8%;font-size:60px;opacity:.05;
  animation:floatPaw2 22s ease-in-out infinite;pointer-events:none;z-index:0;
}
@keyframes floatPaw{0%,100%{transform:translateY(0) rotate(-15deg)}50%{transform:translateY(30px) rotate(10deg)}}
@keyframes floatPaw2{0%,100%{transform:translateY(0) rotate(10deg)}50%{transform:translateY(-25px) rotate(-10deg)}}

main{max-width:640px;margin:0 auto;padding:20px 16px 80px;position:relative;z-index:1}

/* === MEI MEI AVATAR === */
.mei-header{text-align:center;padding:10px 0 0}
.mei-img{
  width:120px;height:120px;border-radius:50%;
  object-fit:cover;object-position:center 30%;
  border:4px solid var(--bd);
  box-shadow:0 4px 24px rgba(232,145,79,.3);
  animation:meiPulse 3s ease-in-out infinite;
  display:block;margin:0 auto 10px;
}
@keyframes meiPulse{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.03) rotate(-1deg)}75%{transform:scale(1.03) rotate(1deg)}}

.mei-speech{
  background:var(--card);border:2px solid var(--bd);border-radius:20px;
  padding:10px 16px;margin:8px auto 0;max-width:320px;position:relative;
  font-size:.93rem;color:var(--mu);font-weight:600;
  box-shadow:0 2px 10px rgba(212,160,90,.08);
}
.mei-speech::before{
  content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:9px solid var(--bd);
}

/* GIF banner */
.mei-gif{
  text-align:center;margin:16px 0 8px;
}
.mei-gif img{
  width:180px;height:auto;border-radius:20px;
  border:3px solid var(--bd);
  box-shadow:0 6px 24px rgba(212,160,90,.2);
}

/* Reaction image (smaller, inline) */
.mei-reaction{
  text-align:center;margin:12px 0 6px;
}
.mei-reaction img{
  width:100px;height:100px;border-radius:50%;
  object-fit:cover;border:3px solid var(--bd);
  box-shadow:0 3px 14px rgba(212,160,90,.18);
}

h1{font-size:1.55rem;margin:8px 0 2px;font-weight:800;text-align:center}
h2{font-size:1.2rem;margin:0 0 12px;font-weight:700}
.mu{color:var(--mu);font-size:.92rem}

/* Cards */
.card{
  background:var(--card);border:1.5px solid var(--bd);border-radius:20px;
  padding:18px;margin:12px 0;
  box-shadow:0 2px 12px rgba(212,160,90,.08);
  transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(212,160,90,.15)}

button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--bd);border-radius:18px;
  padding:16px 18px;margin:10px 0;
  transition:all .2s ease;position:relative;overflow:hidden;
  box-shadow:0 2px 8px rgba(212,160,90,.06);
}
.btn:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,145,79,.15)}
.btn:active{transform:scale(.98)}
.btn b{display:block;font-weight:700;font-size:1.02rem}
.btn span{color:var(--mu);font-size:.88rem}
.btn-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center 30%;border:2px solid var(--bd);opacity:.8}

.pri{
  background:linear-gradient(135deg,var(--ac),#d47a3a);
  color:#fff;text-align:center;border-color:var(--ac);
  font-weight:700;font-size:1.02rem;
  box-shadow:0 4px 16px rgba(232,145,79,.3);
}
.pri:hover{box-shadow:0 6px 24px rgba(232,145,79,.4);filter:brightness(1.05)}
@media(prefers-color-scheme:dark){.pri{color:#1a1008}}

.row{display:flex;gap:10px}.row>*{flex:1}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center}
.chip{
  border:1.5px solid var(--bd);background:var(--card);
  border-radius:99px;padding:8px 16px;font-size:.88rem;
  font-weight:600;transition:all .2s;
  box-shadow:0 1px 4px rgba(212,160,90,.06);
}
.chip:hover{transform:scale(1.04)}
.chip.on{
  background:var(--acs);border-color:var(--ac);color:var(--ac);
  box-shadow:0 2px 10px rgba(232,145,79,.2);
}

/* Progress bar */
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--fur));transition:.4s ease;border-radius:99px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{
  background:none;border:0;color:var(--ac);padding:6px 0;font-size:.95rem;
  font-weight:600;transition:transform .15s;
}
.back:hover{transform:translateX(-3px)}

/* Quiz options */
.opt{
  display:block;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--bd);
  border-radius:16px;padding:14px 16px;margin:9px 0;
  transition:all .2s;font-weight:500;
  box-shadow:0 1px 6px rgba(212,160,90,.05);
}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(4px);box-shadow:0 3px 12px rgba(232,145,79,.12)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt.ok{
  border-color:var(--ok);background:var(--oks);
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
}
.opt.no{
  border-color:var(--no);background:var(--nos);
  animation:shake .4s ease;
}
@keyframes popIn{0%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Explanation box */
.exp{
  background:var(--acs);border-radius:16px;
  padding:14px 16px;margin:12px 0;font-size:.93rem;
  border-left:4px solid var(--ac);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Flash cards */
.fc{
  min-height:240px;display:flex;flex-direction:column;
  justify-content:center;text-align:center;cursor:pointer;
  font-size:1.1rem;transition:transform .3s;
}
.fc:active{transform:scale(.97)}

.tag{
  font-size:.78rem;color:var(--mu);text-transform:uppercase;
  letter-spacing:.08em;font-weight:700;
}

/* Results */
.big{font-size:2.8rem;font-weight:800;margin:4px 0}
.good{color:var(--ok)}.bad{color:var(--no)}

button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* Confetti */
.confetti{pointer-events:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999}
.confetti span{
  position:absolute;width:8px;height:8px;border-radius:2px;
  animation:confettiFall 1s ease forwards;opacity:0;
}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:0;transform:translateY(100vh) rotate(720deg)}
}

/* Running GIF at bottom */
.mei-runner{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:60px;overflow:hidden;pointer-events:none;
  background:linear-gradient(transparent,rgba(254,246,236,.6));
}
@media(prefers-color-scheme:dark){.mei-runner{background:linear-gradient(transparent,rgba(30,23,16,.6))}}
.mei-runner img{
  position:absolute;bottom:4px;height:50px;
  animation:runCat 10s linear infinite;
  border-radius:8px;
}
@keyframes runCat{
  0%{left:-80px;transform:scaleX(1)}
  48%{left:calc(100% + 80px);transform:scaleX(1)}
  50%{left:calc(100% + 80px);transform:scaleX(-1)}
  98%{left:-80px;transform:scaleX(-1)}
  100%{left:-80px;transform:scaleX(1)}
}

/* iPad / tablet */
@media(min-width:768px){
  main{padding:32px 24px 80px}
  .mei-img{width:150px;height:150px}
  .mei-gif img{width:220px}
  .mei-reaction img{width:120px;height:120px}
  .btn{padding:18px 22px}
  .opt{padding:16px 20px}
  .btn-icon{width:52px;height:52px}
}

/* Bounce-in animation */
.btn-bounce{animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both}
.btn-bounce:nth-child(2){animation-delay:.08s}
.btn-bounce:nth-child(3){animation-delay:.16s}
.btn-bounce:nth-child(4){animation-delay:.24s}
@keyframes bounceIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Hero image gallery on home */
.mei-gallery{
  display:flex;gap:8px;justify-content:center;margin:14px 0 6px;
  flex-wrap:wrap;
}
.mei-gallery img{
  width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center 30%;
  border:3px solid var(--bd);transition:all .3s cubic-bezier(.34,1.56,.64,1);cursor:pointer;
  box-shadow:0 2px 8px rgba(212,160,90,.12);
  touch-action:manipulation;
}
.mei-gallery img:hover{transform:scale(1.15) rotate(-5deg);border-color:var(--ac);box-shadow:0 4px 16px rgba(232,145,79,.25)}
.mei-gallery img.tapped{
  border-color:var(--ac) !important;
  box-shadow:0 0 0 3px var(--acs),0 4px 18px rgba(232,145,79,.4) !important;
  transform:scale(1.15) rotate(5deg) !important;
  filter:brightness(1.08);
}
@media(min-width:768px){.mei-gallery img{width:80px;height:80px}}

/* Specific facial alignments so Mei Mei's face is centered in all portrait crops */
img[src*="12.jpg"] { object-position: center 18% !important; }
img[src*="412.jpg"] { object-position: center 25% !important; }
img[src*="89.jpg"] { object-position: center 25% !important; }
img[src*="2.jpg"] { object-position: center 30% !important; }
img[src*="3.jpg"] { object-position: center 20% !important; }
img[src*="7.jpg"] { object-position: center 18% !important; }
img[src*="8.jpg"] { object-position: center 22% !important; }
img[src*="5.png"] { object-position: center 25% !important; }
img[src*="6.jpg"] { object-position: center 28% !important; }
img[src*="images.jpg"] { object-position: center 20% !important; }
img[src*="123.png"] { object-position: center 48% !important; }

/* Easter egg overlay */
.egg-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:eggFadeIn .35s ease-out;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  padding:calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
}
.egg-overlay.closing{
  animation:eggFadeOut .25s ease-in forwards;
}
@keyframes eggFadeIn{from{opacity:0}to{opacity:1}}
@keyframes eggFadeOut{from{opacity:1}to{opacity:0}}

.egg-card{
  display:flex;flex-direction:column;align-items:center;
  animation:eggSlideDown .55s cubic-bezier(.34,1.56,.64,1) both;
  max-width:90vw;
}
@keyframes eggSlideDown{
  0%{transform:translateY(-120vh) scale(.8);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.egg-overlay img{
  width:min(82vw,340px);height:auto;max-height:50vh;
  border-radius:28px;border:5px solid #fff;
  box-shadow:0 12px 48px rgba(232,145,79,.6), 0 0 0 6px var(--paw);
  object-fit:contain;
}
.egg-overlay .egg-text{
  color:#fff;font-size:2.4rem;font-weight:800;
  margin-top:18px;text-align:center;
  text-shadow:0 3px 16px rgba(232,145,79,.9), 0 2px 4px rgba(0,0,0,.5);
  animation:eggTextPop .5s cubic-bezier(.34,1.56,.64,1) .25s both;
}
.egg-overlay .egg-hearts{
  font-size:2.2rem;margin-top:8px;
  animation:eggTextPop .5s cubic-bezier(.34,1.56,.64,1) .35s both;
}
.egg-overlay .egg-sub{
  color:rgba(255,255,255,.9);font-size:.95rem;margin-top:12px;
  background:rgba(0,0,0,.35);padding:6px 18px;border-radius:99px;
  animation:eggTextPop .4s ease .45s both;
}
@keyframes eggTextPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

/* Reaction img face alignment */
.mei-reaction img{object-position:center 30%}

/* iPhone 11 / iOS touch optimizations */
body, button, .chip, .opt, .btn, .card, .fc, .mei-gallery img, .egg-overlay {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
@supports(padding:env(safe-area-inset-bottom)){
  body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .mei-runner{padding-bottom:env(safe-area-inset-bottom)}
}
.chip{min-height:44px;display:inline-flex;align-items:center}
.back{min-height:44px;min-width:44px}
.opt{min-height:48px}

@media(min-width:768px){
  main{max-width:720px;padding:32px 24px calc(90px + env(safe-area-inset-bottom, 0px))}
  .mei-img{width:145px;height:145px}
  .mei-speech{max-width:440px;font-size:1.02rem}
  .btn{padding:20px 22px;border-radius:20px}
  .btn b{font-size:1.1rem}
  .opt{padding:16px 20px;font-size:1.05rem}
  .chips{gap:12px}
  .chip{padding:10px 20px;font-size:1rem}
}
</style>
</head>
<body>

<!-- Mei Mei running across bottom -->
<div class="mei-runner">
  <img src="images/tole-tole-cat-cat.gif" alt="Mei Mei running">
</div>

<main id="app"></main>
<script src="questions.js"></script>
<script>
const app=document.getElementById('app');
const LN={3:'Lesson 3 · Individual Behavior',4:'Lesson 4 · Motivation',5:'Lesson 5 · Groups & Teams'};
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const prep=l=>sh(l).map(x=>{const s=sh(x.o.map((t,i)=>({t,c:i===x.a})));return{...x,o:s.map(z=>z.t),a:s.findIndex(z=>z.c)}});
let scope='all',S={},timer=null;
const pool=()=>Q.filter(x=>scope==='all'||x.l==scope);
const L='ABCD';
const go=f=>{clearInterval(timer);f()};

// ===== MEI MEI IMAGE MAP =====
const MEI={
  home:'images/412.jpg',         // iconic wig stare
  practice:'images/12.jpg',      // wig with roses
  exam:'images/2.jpg',           // pineapple hat (serious!)
  examSetup:'images/89.jpg',     // getting ready
  flash:'images/6.jpg',          // with kitten
  correct:'images/3.jpg',        // being held, happy
  wrong:'images/7.jpg',          // big eyes surprised
  goodScore:'images/8.jpg',      // empress costume
  badScore:'images/5.png',       // gourd hat sad
  review:'images/images.jpg',    // hash brown
  thinking:'images/123.png',     // croc on head
};

// Reaction GIFs
const MEI_GIFS=[
  'images/mei-mei-cat-mei-mei.gif',
  'images/tole-tole-mei-mei.gif',
  'images/vro-vro-cat.gif',
  'images/tole-tole-tole-tole-hashtown.gif',
  'images/tole-tole-cat-tole-tole.gif',
];
const randGif=()=>MEI_GIFS[Math.random()*MEI_GIFS.length|0];

// Speech lines
const SPEECH_HOME=['Study time! Let\'s go~ 📚','Meow~ tap a mode to start!','I believe in you! 🐾','Tole tole~ let\'s review!','*stretches* Ready when you are~'];
const SPEECH_CORRECT=['Purrfect! 🎉','You\'re so smart! 😻','Meow~ that\'s right!','*happy wiggle* ✨','Tole tole~ great job!'];
const SPEECH_WRONG=['It\'s okay, keep trying~ 💪','Hmm, not that one 🤔','Don\'t worry, read the hint! 📖','*head tilt* Try again next time~','We learn from mistakes! 🐾'];
const SPEECH_GOOD=['Amazing!! You\'re the best! 🏆','*proud purr* So impressive! 😸','Tole tole~~ full marks energy!'];
const SPEECH_BAD=['Keep practicing, I\'m cheering for you! 📣','We\'ll get there together~ 🐱','*nuzzle* Don\'t give up!'];
const pick_s=a=>a[Math.random()*a.length|0];

// Confetti burst
function confetti(){
  const c=document.createElement('div');c.className='confetti';
  const colors=['#e8914f','#f5c584','#d4a05a','#5da66e','#f0a060','#d47a3a'];
  for(let i=0;i<30;i++){
    const s=document.createElement('span');
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*40}%;background:${colors[i%colors.length]};animation-delay:${Math.random()*.3}s;animation-duration:${.8+Math.random()*.6}s`;
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1600);
}

function meiHeader(img,speech,gif){
  return `<div class="mei-header">
    <img class="mei-img" src="${img}" alt="Mei Mei">
    <div class="mei-speech">${speech}</div>
    ${gif?`<div class="mei-gif"><img src="${gif}" alt="Mei Mei reaction"></div>`:''}
  </div>`;
}

function meiReaction(img){
  return `<div class="mei-reaction"><img src="${img}" alt="Mei Mei"></div>`;
}

// Easter egg state
let eggTapped=new Set();

function galleryTap(idx,el){
  if(eggTapped.has(idx)){
    eggTapped.delete(idx);
    el.classList.remove('tapped');
  } else {
    eggTapped.add(idx);
    el.classList.add('tapped');
  }
  if(eggTapped.size>=5) setTimeout(showEasterEgg,200);
}

function showEasterEgg(){
  confetti();
  const ov=document.createElement('div');
  ov.className='egg-overlay';
  ov.innerHTML=`
    <div class="egg-card">
      <img src="images/123.png" alt="Mei Mei loves you!">
      <div class="egg-text">I Love You!!! 💕</div>
      <div class="egg-hearts">🐱💖✨💖🐱</div>
      <div class="egg-sub">~ from Mei Mei · tap anywhere to close ~</div>
    </div>
  `;
  let closed=false;
  const dismiss=e=>{
    if(e)e.stopPropagation();
    if(closed)return;
    closed=true;
    ov.classList.add('closing');
    setTimeout(()=>{ov.remove();resetGallery()},250);
  };
  ov.addEventListener('click',dismiss);
  ov.addEventListener('touchend',dismiss);
  document.body.appendChild(ov);
}

function resetGallery(){
  eggTapped.clear();
  document.querySelectorAll('.mei-gallery img').forEach(img=>img.classList.remove('tapped'));
}

function home(){
  eggTapped.clear();
  const n=pool().length;
  const missed=ls.get('missed',[]).length;
  app.innerHTML=`
  ${meiHeader(MEI.home,pick_s(SPEECH_HOME),randGif())}
  <h1>🐱 Mei Mei's Study Café</h1>
  <p class="mu" style="text-align:center">Lessons 3 to 5 · ${Q.length} questions</p>
  <div class="mei-gallery">
    <img src="images/3.jpg" alt="Mei Mei" onclick="galleryTap(0,this)">
    <img src="images/6.jpg" alt="Mei Mei and kitten" onclick="galleryTap(1,this)">
    <img src="images/8.jpg" alt="Empress Mei Mei" onclick="galleryTap(2,this)">
    <img src="images/2.jpg" alt="Pineapple Mei Mei" onclick="galleryTap(3,this)">
    <img src="images/123.png" alt="Croc Mei Mei" onclick="galleryTap(4,this)">
  </div>
  <div class="chips">${['all',3,4,5].map(s=>`<button class="chip ${scope==s?'on':''}" onclick="scope='${s}';home()">${s=='all'?'🐾 All lessons':'📖 Lesson '+s}</button>`).join('')}</div>
  <p class="mu" style="text-align:center">${n} questions in this selection</p>
  <button class="btn btn-bounce" onclick="go(()=>startQuiz('practice'))"><b>🎯 Practice Mode</b><span>Instant feedback · Mei Mei reacts to every answer!</span><img class="btn-icon" src="${MEI.practice}" alt=""></button>
  <button class="btn btn-bounce" onclick="go(flash)"><b>🃏 Flash Cards</b><span>Tap to flip · question on front, answer on back</span><img class="btn-icon" src="${MEI.flash}" alt=""></button>
  <button class="btn btn-bounce" onclick="go(examSetup)"><b>⏱️ Exam Mode</b><span>Timed, no hints, graded at the end</span><img class="btn-icon" src="${MEI.exam}" alt=""></button>
  <button class="btn btn-bounce" onclick="go(()=>review('all'))"><b>📋 Review Section</b><span>See your last attempt${missed?` · ${missed} missed`:''}</span><img class="btn-icon" src="${MEI.review}" alt=""></button>`;
}

function examSetup(){
  const n=pool().length,opts=[10,20,n].filter((v,i,a)=>v<=n&&a.indexOf(v)===i);
  app.innerHTML=`${meiHeader(MEI.examSetup,'Stay focused! You\'ve got this~ 🧐')}
  <button class="back" onclick="home()">← Back</button><h2>⏱️ Exam Mode</h2>
  <p class="mu">Choose how many questions. You get 1 minute per question.</p>
  ${opts.map(c=>`<button class="btn pri btn-bounce" onclick="startQuiz('exam',${c})">${c===n?'All '+n:c} questions</button>`).join('')}`;
}

function startQuiz(mode,count){
  const qs=prep(pool()).slice(0,count||999);
  S={mode,qs,i:0,a:Array(qs.length).fill(null),left:qs.length*60};
  if(mode==='exam')timer=setInterval(()=>{S.left--;const t=document.getElementById('tm');if(t)t.textContent=fmt(S.left);if(S.left<=0)finish()},1000);
  quiz();
}
const fmt=s=>`${s/60|0}:${String(s%60).padStart(2,'0')}`;

function quiz(){
  const {mode,qs,i,a}=S,q=qs[i],ex=mode==='exam',locked=!ex&&a[i]!==null,last=i===qs.length-1;
  const isRight=locked&&a[i]===q.a;
  const img=ex?MEI.exam:locked?(isRight?MEI.correct:MEI.wrong):(mode==='practice'?MEI.practice:MEI.thinking);
  const speech=ex?`Question ${i+1} of ${qs.length}… focus!`:locked?(isRight?pick_s(SPEECH_CORRECT):pick_s(SPEECH_WRONG)):'Pick your answer~ 🐾';
  const gif=locked&&!isRight?randGif():null;

  app.innerHTML=`<div class="top"><button class="back" onclick="if(confirm('Leave this session?'))go(home)">← Quit</button>
  <span class="mu">${ex?`⏱ <span id="tm">${fmt(S.left)}</span> · `:''}${i+1} / ${qs.length}</span></div>
  <div class="bar"><i style="width:${(i+(locked?1:0))/qs.length*100}%"></i></div>
  ${meiHeader(img,speech,gif)}
  <div class="tag">${LN[q.l]}</div><h2 style="margin-top:6px">${q.q}</h2>
  ${q.o.map((t,k)=>{let c='opt';if(ex&&a[i]===k)c+=' sel';if(locked){if(k===q.a)c+=' ok';else if(k===a[i])c+=' no'}
  return `<button class="${c}" onclick="pick(${k})" ${locked?'disabled':''}><b>${L[k]}.</b> ${t}</button>`}).join('')}
  ${locked?`<div class="exp"><b>${isRight?'✅ Correct!':'❌ Not quite.'}</b> ${q.e}</div>`:''}
  <div class="row" style="margin-top:16px">
  ${ex&&i>0?`<button class="btn" style="text-align:center" onclick="S.i--;quiz()">← Previous</button>`:''}
  ${ex?(last?`<button class="btn pri" onclick="submitExam()">Submit exam 🐱</button>`:`<button class="btn pri" onclick="S.i++;quiz()">Next →</button>`)
  :(locked?`<button class="btn pri" onclick="${last?'finish()':'S.i++;quiz()'}">${last?'See results 🏆':'Next →'}</button>`:'')}</div>`;
}

function pick(k){
  if(S.mode!=='exam'&&S.a[S.i]!==null)return;
  S.a[S.i]=k;
  if(S.mode!=='exam'&&k===S.qs[S.i].a) confetti();
  quiz();
}
function submitExam(){const u=S.a.filter(x=>x===null).length;if(!u||confirm(`${u} question(s) unanswered. Submit anyway?`))finish()}

function finish(){
  clearInterval(timer);
  const items=S.qs.map((q,k)=>({...q,pick:S.a[k]}));
  const right=items.filter(x=>x.pick===x.a).length,pct=Math.round(right/items.length*100);
  ls.set('last',{mode:S.mode,date:new Date().toLocaleString(),items});
  let m=new Set(ls.get('missed',[]));
  items.forEach(x=>x.pick===x.a?m.delete(x.q):m.add(x.q));
  ls.set('missed',[...m]);
  const isGood=pct>=75;
  if(isGood) confetti();
  const img=isGood?MEI.goodScore:MEI.badScore;
  const speech=isGood?pick_s(SPEECH_GOOD):pick_s(SPEECH_BAD);
  app.innerHTML=`${meiHeader(img,speech,isGood?randGif():null)}
  <div class="card" style="text-align:center">
    <div class="tag">${S.mode} results</div>
    <div class="big ${pct>=75?'good':pct>=50?'':'bad'}">${pct}%</div>
    <p>${right} of ${items.length} correct</p>
    <p class="mu">${pct>=75?'🎉 Empress Mei Mei is proud of you!':pct>=50?'Getting there! Review the misses below~ 🐾':'Keep going! Mei Mei believes in you~ 💪'}</p>
  </div>
  <button class="btn pri btn-bounce" onclick="review('all')">📋 Review answers</button>
  <button class="btn btn-bounce" onclick="go(home)"><b>🏠 Back to Café</b></button>`;
}

function review(f){
  const L0=ls.get('last');
  if(!L0){app.innerHTML=`${meiHeader(MEI.badScore,'No attempts yet! Go do a quiz~ 🐾')}
  <button class="back" onclick="home()">← Back</button>
  <div class="card">No attempts yet. Finish a Practice or Exam session first!</div>`;return}
  const items=L0.items.filter(x=>f==='all'||x.pick!==x.a),missed=ls.get('missed',[]).length;
  app.innerHTML=`<button class="back" onclick="home()">← Back</button>
  ${meiHeader(MEI.review,'Let\'s review together~ 📖')}
  <h2>📋 Review</h2>
  <p class="mu">Last ${L0.mode}: ${L0.date}</p>
  <div class="chips"><button class="chip ${f=='all'?'on':''}" onclick="review('all')">All (${L0.items.length})</button>
  <button class="chip ${f!='all'?'on':''}" onclick="review('wrong')">Wrong / skipped (${L0.items.filter(x=>x.pick!==x.a).length})</button></div>
  ${missed?`<button class="btn btn-bounce" onclick="drillMissed()"><b>🔄 Practice all missed (${missed})</b><span>Includes misses from earlier sessions</span></button>`:''}
  ${items.map(x=>`<div class="card"><div class="tag">${LN[x.l]}</div><p><b>${x.q}</b></p>
  ${x.o.map((t,k)=>`<div class="opt ${k===x.a?'ok':k===x.pick?'no':''}" style="margin:6px 0"><b>${L[k]}.</b> ${t}${k===x.a?' ✅':k===x.pick?' (your answer)':''}</div>`).join('')}
  ${x.pick===null?'<p class="bad">⏭️ Skipped</p>':''}<div class="exp">${x.e}</div></div>`).join('')||'<div class="card">Nothing here~ 🐾</div>'}`;
}
function drillMissed(){
  const m=ls.get('missed',[]),qs=prep(Q.filter(x=>m.includes(x.q)));
  S={mode:'practice',qs,i:0,a:Array(qs.length).fill(null)};quiz();
}

function flash(){
  S={deck:sh(pool()),i:0,flip:false};card();
}
function card(){
  const {deck,i,flip}=S,q=deck[i];
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">← Back</button><span class="mu">${i+1} / ${deck.length}</span></div>
  <div class="bar"><i style="width:${(i+1)/deck.length*100}%"></i></div>
  ${meiHeader(MEI.flash,flip?'Here\'s the answer~ 😸':'Tap the card to flip! 🃏')}
  <div class="card fc" onclick="S.flip=!S.flip;card()"><div class="tag">${flip?'Answer 💡':LN[q.l]}</div>
  ${flip?`<p><b>${q.o[q.a]}</b></p><p class="mu" style="font-size:.93rem">${q.e}</p>`:`<p>${q.q}</p><p class="mu" style="font-size:.85rem">🐾 Tap to flip</p>`}
  </div>
  <div class="row"><button class="btn" style="text-align:center" ${i?'':'disabled'} onclick="S.i--;S.flip=false;card()">← Previous</button>
  <button class="btn pri" onclick="${i<deck.length-1?'S.i++;S.flip=false;card()':'S.deck=sh(S.deck);S.i=0;S.flip=false;card()'}">${i<deck.length-1?'Next →':'🔀 Shuffle & restart'}</button></div>`;
}
home();
</script>
</body>
</html>
